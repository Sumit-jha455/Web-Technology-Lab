<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

</head>

<body>

    <center>

        <h1>Student Registration Form</h1>

        <hr>

        <form id="registrationForm" onsubmit="return validateForm()">

            <!-- Full Name -->

            <label for="name">Full Name:</label>

            <input type="text" id="name" placeholder="Enter your name">

            <br><br>


            <!-- Email -->

            <label for="email">Email Address:</label>

            <input type="text" id="email" placeholder="Enter your email">

            <br><br>


            <!-- Address -->

            <label for="address">Address:</label>

            <br><br>

            <textarea id="address" rows="4" cols="30"
                placeholder="Enter your address"></textarea>

            <br><br>


            <!-- Pincode -->

            <label for="pincode">Pincode:</label>

            <input type="text" id="pincode" placeholder="Enter 6 digit pincode">

            <br><br>


            <!-- Password -->

            <label for="password">Password:</label>

            <input type="password" id="password" placeholder="Enter password">

            <br><br>


            <!-- Confirm Password -->

            <label for="confirmPassword">Confirm Password:</label>

            <input type="password" id="confirmPassword"
                placeholder="Confirm password">

            <br><br>


            <!-- Buttons -->

            <input type="submit" value="Register">

            <input type="reset" value="Reset">

        </form>

    </center>


    <!-- JavaScript Validation -->

    <script>

        function validateForm() {

            // Get input values

            let name = document.getElementById("name").value.trim();

            let email = document.getElementById("email").value.trim();

            let address = document.getElementById("address").value.trim();

            let pincode = document.getElementById("pincode").value.trim();

            let password = document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;


            // Validate Name

            if (name === "") {

                alert("Please enter your name.");

                return false;

            }


            // Validate Email

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {

                alert("Please enter a valid email address.");

                return false;

            }


            // Validate Address

            if (address === "") {

                alert("Please enter your address.");

                return false;

            }


            // Validate Pincode

            let pincodePattern = /^[0-9]{6}$/;

            if (!pincodePattern.test(pincode)) {

                alert("Pincode must contain exactly 6 digits.");

                return false;

            }


            // Validate Password Length

            if (password.length < 8) {

                alert("Password must contain at least 8 characters.");

                return false;

            }


            // Validate Capital Letter

            let capitalPattern = /[A-Z]/;

            if (!capitalPattern.test(password)) {

                alert("Password must contain at least one capital letter.");

                return false;

            }


            // Confirm Password

            if (password !== confirmPassword) {

                alert("Password and Confirm Password do not match.");

                return false;

            }


            // Successful Validation

            alert("Registration Successful!");

            return false;

        }

    </script>

</body>

</html>
